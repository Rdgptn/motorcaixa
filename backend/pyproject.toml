[project]
name = "motorcaixa-api"
version = "0.1.0"
description = "API FastAPI do MotorCaixa"
requires-python = ">=3.12,<3.16"
dependencies = [
  "fastapi[standard]==0.141.1",
  "uvicorn==0.52.1",
  "python-dotenv>=1.0.1",
  "pymongo==4.18.2",
  "pydantic>=2.6.4",
  "email-validator>=2.2.0",
  "pyjwt>=2.10.1",
  "passlib>=1.7.4",
  "bcrypt==4.0.1",
  "tzdata>=2024.2",
  "motor==3.7.1",
  "python-jose>=3.3.0",
  "requests>=2.31.0",
  "stripe>=11.0.0",
  "openpyxl>=3.1.5",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
]

[tool.fastapi]
entrypoint = "server:app"
